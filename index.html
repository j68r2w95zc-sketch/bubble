<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bubble - Artist Chat</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --primary-color: #ff3b30;
      --bubble-bg: #fdf2f2;
      --bg-color: #f7f7f8;
      --text-main: #1c1c1e;
      --text-sub: #8e8e93;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #app {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    header {
      padding: 16px 20px;
      background: #ffffff;
      border-bottom: 1px solid #efeff4;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
    }
    header h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #user-badge {
      font-size: 13px;
      padding: 4px 10px;
      background: #f2f2f7;
      border-radius: 12px;
      color: var(--text-sub);
      font-weight: 500;
    }
    #messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #fafafa;
    }
    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 78%;
    }
    .message-row.sent {
      align-self: flex-end;
      align-items: flex-end;
    }
    .message-row.received {
      align-self: flex-start;
      align-items: flex-start;
    }
    .sender-name {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 4px;
      margin-left: 4px;
      font-weight: 600;
    }
    .message-bubble {
      padding: 12px 16px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.45;
      word-break: break-word;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .received .message-bubble {
      background: #ffffff;
      color: var(--text-main);
      border-bottom-left-radius: 4px;
      border: 1px solid #f0f0f2;
    }
    .sent .message-bubble {
      background: var(--primary-color);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    footer {
      padding: 14px 16px;
      background: #ffffff;
      border-top: 1px solid #efeff4;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #e5e5ea;
      border-radius: 24px;
      outline: none;
      font-size: 15px;
      background: #f2f2f7;
      transition: all 0.2s;
    }
    input[type="text"]:focus {
      background: #ffffff;
      border-color: var(--primary-color);
    }
    button.send-action {
      padding: 12px 20px;
      border: none;
      background: var(--primary-color);
      color: white;
      border-radius: 24px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button.send-action:disabled {
      background: #d1d1d6;
      cursor: not-allowed;
    }
    #login-modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.98);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 30px;
      z-index: 100;
      text-align: center;
    }
    #login-modal h2 {
      font-size: 24px;
      color: var(--text-main);
    }
    #login-modal p {
      font-size: 14px;
      color: var(--text-sub);
      margin-top: -10px;
    }
    #login-modal input {
      width: 100%;
      max-width: 280px;
      text-align: center;
      font-size: 16px;
    }
    #login-modal button {
      width: 100%;
      max-width: 280px;
      padding: 14px;
      border: none;
      background: var(--primary-color);
      color: white;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- 로그인 모달 (닉네임 기반 역할 분기) -->
    <div id="login-modal">
      <h2>Bubble</h2>
      <p>아티스트와 소통하는 공간에 오신 것을 환영합니다</p>
      <input type="text" id="username-input" placeholder="닉네임을 입력하세요">
      <button id="login-btn">입장하기</button>
    </div>

    <!-- 헤더 -->
    <header>
      <h1>💬 Bubble</h1>
      <span id="user-badge"></span>
    </header>

    <!-- 메시지 목록 영역 -->
    <div id="messages"></div>

    <!-- 입력창 영역 -->
    <footer>
      <input type="text" id="message-input" placeholder="아티스트만 메시지를 보낼 수 있습니다." disabled>
      <button id="send-btn" class="send-action" disabled>전송</button>
    </footer>
  </div>

  <!-- Firebase 및 채팅 핵심 로직 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAZWuBetWOeffq13ho126kUkbR0qDNnWis",
      authDomain: "bubble-5267e.firebaseapp.com",
      projectId: "bubble-5267e",
      storageBucket: "bubble-5267e.firebasestorage.app",
      messagingSenderId: "381706100941",
      appId: "1:381706100941:web:8e32cc424083823048c984",
      measurementId: "G-XZTW9X5JQM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentUser = "";
    let isAdmin = false;

    const loginModal = document.getElementById("login-modal");
    const usernameInput = document.getElementById("username-input");
    const loginBtn = document.getElementById("login-btn");
    const userBadge = document.getElementById("user-badge");
    const messageInput = document.getElementById("message-input");
    const sendBtn = document.getElementById("send-btn");
    const messagesContainer = document.getElementById("messages");

    loginBtn.addEventListener("click", handleLogin);
    usernameInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") handleLogin();
    });

    function handleLogin() {
      const username = usernameInput.value.trim();
      if (!username) {
        alert("닉네임을 입력해주세요!");
        return;
      }

      currentUser = username;
      isAdmin = (currentUser.toLowerCase() === "gpepsl");

      loginModal.style.display = "none";
      userBadge.textContent = isAdmin ? "👑 아티스트 (gpepsl)" : `👤 ${currentUser}`;

      if (isAdmin) {
        messageInput.disabled = false;
        sendBtn.disabled = false;
        messageInput.placeholder = "메시지를 입력하세요...";
      } else {
        messageInput.disabled = true;
        messageInput.placeholder = "아티스트만 메시지를 보낼 수 있습니다.";
      }

      initRealtimeSync();
    }

    function initRealtimeSync() {
      const q = query(collection(db, "messages"), orderBy("timestamp", "asc"));

      onSnapshot(q, (snapshot) => {
        messagesContainer.innerHTML = "";
        snapshot.forEach((doc) => {
          const data = doc.data();
          const isMe = (data.sender === currentUser);

          const rowEl = document.createElement("div");
          rowEl.className = `message-row ${isMe ? 'sent' : 'received'}`;

          // 상대방이 보낸 메시지일 경우 보낸 사람 표시
          if (!isMe) {
            const senderEl = document.createElement("div");
            senderEl.className = "sender-name";
            senderEl.textContent = data.sender;
            rowEl.appendChild(senderEl);
          }

          const bubbleEl = document.createElement("div");
          bubbleEl.className = "message-bubble";
          bubbleEl.textContent = data.text;
          rowEl.appendChild(bubbleEl);

          messagesContainer.appendChild(rowEl);
        });
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      });
    }

    async function sendMessage() {
      if (!isAdmin) return;
      const text = messageInput.value.trim();
      if (!text) return;

      messageInput.value = "";

      try {
        await addDoc(collection(db, "messages"), {
          text: text,
          sender: currentUser,
          timestamp: serverTimestamp()
        });
      } catch (e) {
        console.error("전송 실패:", e);
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    messageInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
