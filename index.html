<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import {
        getFirestore,
        collection,
        doc,
        addDoc,
        setDoc,
        getDoc,
        getDocs,
        updateDoc,
        deleteDoc,
        query,
        orderBy,
        where,
        onSnapshot,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


    // =========================================================
    // Firebase
    // =========================================================

    const firebaseConfig = {
        apiKey: "AIzaSyAZWuBetWOeffq13ho126kUkbR0qDNnWis",
        authDomain: "bubble-5267e.firebaseapp.com",
        projectId: "bubble-5267e",
        storageBucket: "bubble-5267e.firebasestorage.app",
        messagingSenderId: "381706100941",
        appId: "1:381706100941:web:8e32cc424083823048c984",
        measurementId: "G-XZTW9X5JQM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);


    // =========================================================
    // 기본 변수
    // =========================================================

    let currentUser = JSON.parse(localStorage.getItem("gb_current_user")) || {
        nickname: "",
        userId: ""
    };

    let isSignedUp = !!currentUser.userId;

    let artists = [];
    let registeredUsers = [];
    let bubbleRequests = [];
    let subscribedTickets = [];
    let userNotifications = [];

    let unreadNotiCount = 0;

    let currentChatArtistId = null;
    let replyingToMsg = null;
    let currentMessagesCache = [];

    let unsubscribeUsers = null;
    let unsubscribeArtists = null;
    let unsubscribeRequests = null;
    let unsubscribeTickets = null;
    let unsubscribeNotifications = null;
    let unsubscribeMessages = null;


    // =========================================================
    // 기본 아티스트
    // =========================================================

    const defaultArtist = {
        id: "artist_default",
        linkedUserId: "gpepsl",
        name: "혜린",
        avatar: "💧",
        desc: "광버블 아티스트"
    };


    // =========================================================
    // 초기 실행
    // =========================================================

    window.addEventListener("DOMContentLoaded", async () => {

        // 기본 아티스트가 Firebase에 없으면 생성
        await createDefaultArtist();

        // 전체 데이터 실시간 연결
        startGlobalListeners();

        // 현재 로그인 유저 연결
        if (isSignedUp) {
            await startUserListeners();
        }

        setTimeout(() => {

            const splash = document.getElementById("splashScreen");

            splash.style.opacity = "0";

            setTimeout(() => {

                splash.style.display = "none";

                const isStandalone =
                    window.matchMedia("(display-mode: standalone)").matches ||
                    window.navigator.standalone;

                if (isStandalone) {

                    document.getElementById("appMainContainer").style.display = "flex";
                    document.getElementById("bottomNavBar").style.display = "flex";

                    initAppUI();

                } else {

                    document.getElementById("safariGuideContainer").style.display = "flex";

                }

            }, 600);

        }, 1500);
    });


    // =========================================================
    // 기본 아티스트 생성
    // =========================================================

    async function createDefaultArtist() {

        try {

            const ref = doc(db, "artists", defaultArtist.id);
            const snap = await getDoc(ref);

            if (!snap.exists()) {
                await setDoc(ref, defaultArtist);
            }

        } catch (error) {
            console.error("기본 아티스트 생성 오류:", error);
        }
    }


    // =========================================================
    // 전체 Firebase 실시간 연결
    // =========================================================

    function startGlobalListeners() {

        // -----------------------------
        // 회원 목록
        // -----------------------------

        if (unsubscribeUsers) unsubscribeUsers();

        unsubscribeUsers = onSnapshot(
            collection(db, "users"),
            snapshot => {

                registeredUsers = [];

                snapshot.forEach(docSnap => {

                    registeredUsers.push({
                        id: docSnap.id,
                        ...docSnap.data()
                    });

                });

                if (isSignedUp) {
                    updateUserInfoUI();
                }

            },
            error => {
                console.error("회원 목록 오류:", error);
            }
        );


        // -----------------------------
        // 아티스트 목록
        // -----------------------------

        if (unsubscribeArtists) unsubscribeArtists();

        unsubscribeArtists = onSnapshot(
            collection(db, "artists"),
            snapshot => {

                artists = [];

                snapshot.forEach(docSnap => {

                    artists.push({
                        id: docSnap.id,
                        ...docSnap.data()
                    });

                });

                // 기본 아티스트가 없으면 추가
                if (artists.length === 0) {
                    setDoc(
                        doc(db, "artists", defaultArtist.id),
                        defaultArtist
                    );
                }

                renderArtistList();
                renderChatList();
                renderMypageMenu();
                recalculateNotiCount();

            },
            error => {
                console.error("아티스트 목록 오류:", error);
            }
        );


        // -----------------------------
        // 물방울 신청 목록
        // -----------------------------

        if (unsubscribeRequests) unsubscribeRequests();

        unsubscribeRequests = onSnapshot(
            collection(db, "bubbleRequests"),
            snapshot => {

                bubbleRequests = [];

                snapshot.forEach(docSnap => {

                    bubbleRequests.push({
                        id: docSnap.id,
                        ...docSnap.data()
                    });

                });

                recalculateNotiCount();

            },
            error => {
                console.error("신청 목록 오류:", error);
            }
        );


        // -----------------------------
        // 채팅 메시지
        // -----------------------------

        if (unsubscribeMessages) unsubscribeMessages();

        const messageQuery = query(
            collection(db, "messages"),
            orderBy("timestamp", "asc")
        );

        unsubscribeMessages = onSnapshot(
            messageQuery,
            snapshot => {

                currentMessagesCache = [];

                snapshot.forEach(docSnap => {

                    currentMessagesCache.push({
                        id: docSnap.id,
                        ...docSnap.data()
                    });

                });

                if (currentChatArtistId) {
                    renderMessages(currentMessagesCache);
                }

            },
            error => {

                console.error("채팅 실시간 연결 오류:", error);

                if (error.code === "permission-denied") {
                    showToast("Firestore 권한을 확인해주세요.");
                }

            }
        );
    }


    // =========================================================
    // 현재 유저 데이터 실시간 연결
    // =========================================================

    async function startUserListeners() {

        stopUserListeners();

        if (!currentUser.userId) return;

        // -----------------------------
        // 방울권
        // -----------------------------

        const ticketQuery = query(
            collection(db, "tickets"),
            where("userId", "==", currentUser.userId)
        );

        unsubscribeTickets = onSnapshot(
            ticketQuery,
            snapshot => {

                subscribedTickets = [];

                snapshot.forEach(docSnap => {

                    const data = docSnap.data();

                    if (data.artistId) {
                        subscribedTickets.push(data.artistId);
                    }

                });

                renderChatList();
                recalculateNotiCount();

            },
            error => {
                console.error("방울권 오류:", error);
            }
        );


        // -----------------------------
        // 알림
        // -----------------------------

        const notiQuery = query(
            collection(
                db,
                "users",
                currentUser.userId,
                "notifications"
            ),
            orderBy("createdAt", "asc")
        );

        unsubscribeNotifications = onSnapshot(
            notiQuery,
            snapshot => {

                userNotifications = [];

                snapshot.forEach(docSnap => {

                    userNotifications.push({
                        id: docSnap.id,
                        ...docSnap.data()
                    });

                });

                recalculateNotiCount();

            },
            error => {
                console.error("알림 오류:", error);
            }
        );
    }


    function stopUserListeners() {

        if (unsubscribeTickets) {
            unsubscribeTickets();
            unsubscribeTickets = null;
        }

        if (unsubscribeNotifications) {
            unsubscribeNotifications();
            unsubscribeNotifications = null;
        }
    }


    // =========================================================
    // UI 초기화
    // =========================================================

    function initAppUI() {

        if (isSignedUp && currentUser.userId) {

            updateUserInfoUI();

            document.getElementById("authButtonGroup").style.display = "none";

            renderMypageMenu();

        } else {

            document.getElementById("displayNickname").innerText = "비눗방울";
            document.getElementById("displayId").innerText = "@guest_bubble";

            document.getElementById("authButtonGroup").style.display = "flex";

            document.getElementById("mypageMenuList").style.display = "none";
        }

        renderArtistList();
        renderChatList();
        recalculateNotiCount();
    }


    function updateUserInfoUI() {

        if (!currentUser.userId) return;

        document.getElementById("displayNickname").innerText =
            currentUser.nickname;

        document.getElementById("displayId").innerText =
            "@" + currentUser.userId;

        document.getElementById("authButtonGroup").style.display = "none";
    }


    // =========================================================
    // 탭
    // =========================================================

    window.switchTab = function(tabIndex) {

        const buttons = document.querySelectorAll(".nav-btn");

        buttons.forEach((btn, idx) => {

            if (idx + 1 === tabIndex) {
                btn.classList.add("active");
            } else {
                btn.classList.remove("active");
            }

        });

        for (let i = 1; i <= 3; i++) {
            document
                .getElementById(`tab${i}`)
                .classList.remove("active");
        }

        document
            .getElementById(`tab${tabIndex}`)
            .classList.add("active");


        if (tabIndex === 2) {
            closeChatRoom();
            renderChatList();
        }
    };


    // =========================================================
    // 알림
    // =========================================================

    function updateNotiBadge() {

        const badge = document.getElementById("notiBadge");

        if (!currentUser.userId || unreadNotiCount <= 0) {

            badge.style.display = "none";

        } else {

            badge.innerText = unreadNotiCount;
            badge.style.display = "block";

        }
    }


    function recalculateNotiCount() {

        if (!currentUser.userId) {

            unreadNotiCount = 0;
            updateNotiBadge();
            return;

        }

        let count = userNotifications.length;

        const isMyArtist =
            currentUser.userId === "gpepsl" ||
            artists.some(
                a => a.linkedUserId === currentUser.userId
            );

        if (isMyArtist) {

            count += bubbleRequests.filter(
                r => r.status === "pending"
            ).length;

        }

        unreadNotiCount = count;

        updateNotiBadge();
    }


    // =========================================================
    // 아티스트 목록
    // =========================================================

    function renderArtistList() {

        const container =
            document.getElementById("artistListContainer");

        if (!container) return;

        container.innerHTML = "";

        artists.forEach(artist => {

            const item = document.createElement("div");

            item.className = "artist-item";

            item.onclick = () => openArtistDetail(artist);

            item.innerHTML = `
                <div class="profile-img">${artist.avatar || "💧"}</div>

                <div class="artist-info">

                    <span class="artist-name">
                        ${escapeHTML(artist.name)}
                    </span>

                    <span class="artist-status">
                        ${escapeHTML(artist.desc || "광버블 아티스트")}
                    </span>

                </div>
            `;

            container.appendChild(item);
        });
    }


    // =========================================================
    // 아티스트 상세
    // =========================================================

    function openArtistDetail(artist) {

        if (!isSignedUp || !currentUser.userId) {

            showToast("회원가입을 먼저 해주세요!");

            switchTab(3);
            openSignupModal();

            return;
        }

        document.getElementById("artistListView").style.display = "none";

        document.getElementById("artistDetailView").style.display = "flex";

        document.getElementById("detailAvatar").innerText =
            artist.avatar || "💧";

        document.getElementById("detailName").innerText =
            artist.name;


        const actionArea =
            document.getElementById("subscribeActionArea");

        const isSelfArtist =
            artist.linkedUserId === currentUser.userId;


        if (isSelfArtist) {

            actionArea.innerHTML = `
                <div class="subscribed-tag">
                    ✨ 본인 아티스트 계정입니다
                </div>

                <button
                    class="subscribe-btn"
                    style="margin-top:10px;"
                    onclick="goToChatFromDetail('${artist.id}')">
                    내 버블 방 이동
                </button>
            `;

            return;
        }


        const isSubbed =
            subscribedTickets.includes(artist.id);


        if (isSubbed) {

            actionArea.innerHTML = `
                <div class="subscribed-tag">
                    이미 끊은 방울권입니다! ✨
                </div>

                <button
                    class="subscribe-btn"
                    style="margin-top:10px;"
                    onclick="goToChatFromDetail('${artist.id}')">
                    채팅으로 이동
                </button>
            `;

        } else {

            actionArea.innerHTML = `
                <button
                    class="subscribe-btn"
                    onclick="buyTicket('${artist.id}')">
                    방울권 끊기
                </button>
            `;
        }
    }


    window.closeArtistDetail = function() {

        document.getElementById("artistDetailView").style.display = "none";

        document.getElementById("artistListView").style.display = "block";
    };


    // =========================================================
    // 방울권
    // =========================================================

    window.buyTicket = async function(artistId) {

        if (!isSignedUp || !currentUser.userId) {

            showToast("회원가입을 먼저 해주세요!");

            switchTab(3);
            openSignupModal();

            return;
        }


        if (subscribedTickets.includes(artistId)) {

            showToast("이미 끊은 방울권입니다.");

            return;
        }


        try {

            await setDoc(
                doc(
                    db,
                    "tickets",
                    `${currentUser.userId}_${artistId}`
                ),
                {
                    userId: currentUser.userId,
                    artistId: artistId,
                    createdAt: serverTimestamp()
                }
            );

            showToast("방울권 끊기 성공!");

            const artist =
                artists.find(a => a.id === artistId);

            if (artist) {
                openArtistDetail(artist);
            }

        } catch (error) {

            console.error(error);
            showToast("방울권 저장에 실패했습니다.");

        }
    };


    window.cancelTicket = async function(artistId) {

        try {

            await deleteDoc(
                doc(
                    db,
                    "tickets",
                    `${currentUser.userId}_${artistId}`
                )
            );

            showToast("방울권이 취소되었습니다.");

            openMyTicketsModal();

        } catch (error) {

            console.error(error);
            showToast("방울권 취소에 실패했습니다.");

        }
    };


    // =========================================================
    // 채팅 목록
    // =========================================================

    function renderChatList() {

        const container =
            document.getElementById("chatListContainer");

        if (!container) return;


        if (!isSignedUp || !currentUser.userId) {

            container.innerHTML = `
                <div style="
                    text-align:center;
                    padding:40px 20px;
                    color:#78909C;
                    grid-column:span 2;">
                    회원가입 후 이용 가능합니다! 💧
                </div>
            `;

            return;
        }


        let activeChatIds = [...subscribedTickets];


        const myArtist =
            artists.find(
                a => a.linkedUserId === currentUser.userId
            );


        if (
            myArtist &&
            !activeChatIds.includes(myArtist.id)
        ) {

            activeChatIds.unshift(myArtist.id);
        }


        if (activeChatIds.length === 0) {

            container.innerHTML = `
                <div style="
                    text-align:center;
                    padding:40px 20px;
                    color:#78909C;
                    grid-column:span 2;">

                    구독 중인 물방울이 없습니다.<br>
                    먼저 방울권을 끊어주세요! 💧

                </div>
            `;

            return;
        }


        container.innerHTML = "";


        activeChatIds.forEach(id => {

            const artist =
                artists.find(a => a.id === id);

            if (!artist) return;


            const item =
                document.createElement("div");

            item.className = "artist-item";

            item.onclick = () =>
                openChatRoom(id);


            item.innerHTML = `
                <div class="profile-img">
                    ${artist.avatar || "💧"}
                </div>

                <div class="artist-info">

                    <span class="artist-name">
                        ${escapeHTML(artist.name)}
                    </span>

                    <span
                        class="artist-status"
                        style="color:#444;">
                        실시간 채팅방 💬
                    </span>

                </div>
            `;

            container.appendChild(item);

        });
    }


    window.goToChatFromDetail = function(artistId) {

        closeArtistDetail();

        switchTab(2);

        openChatRoom(artistId);
    };


    function openChatRoom(artistId) {

        currentChatArtistId = artistId;

        const artist =
            artists.find(a => a.id === artistId);

        if (!artist) return;


        document.getElementById("chatListView").style.display =
            "none";

        document.getElementById("chatRoomView").style.display =
            "flex";


        document.getElementById("chatRoomTitle").innerText =
            `💬 ${artist.name}와의 버블 채팅`;


        renderMessages(currentMessagesCache);
    }


    window.closeChatRoom = function() {

        currentChatArtistId = null;

        document.getElementById("chatRoomView").style.display =
            "none";

        document.getElementById("chatListView").style.display =
            "block";

        renderChatList();
    };


    // =========================================================
    // 채팅 메시지 출력
    // =========================================================

    function renderMessages(messages) {

        const container =
            document.getElementById("chatMessages");

        if (!container) return;


        container.innerHTML = "";


        const targetArtist =
            artists.find(a => a.id === currentChatArtistId);


        const isMyArtist =
            targetArtist &&
            targetArtist.linkedUserId === currentUser.userId;


        const roomMessages =
            messages.filter(
                m => m.artistId === currentChatArtistId
            );


        roomMessages.forEach(msg => {

            const bubble =
                document.createElement("div");


            // 아티스트가 보고 있는 화면
            if (isMyArtist) {

                if (msg.isArtistSender) {

                    bubble.className =
                        "msg-bubble artist-sky-right";

                    bubble.innerText =
                        msg.text;

                } else if (msg.isReply) {

                    bubble.className =
                        "msg-bubble reply-box";

                    bubble.innerHTML = `
                        <div class="reply-target-tag">
                            ↳ [답장] ${escapeHTML(msg.fanNickname || "")}님에게:
                        </div>

                        ${escapeHTML(msg.text)}
                    `;

                } else {

                    bubble.className =
                        "msg-bubble white-left";

                    bubble.innerHTML = `
                        <div style="
                            font-size:0.75rem;
                            color:#0288D1;
                            font-weight:bold;">
                            ${escapeHTML(msg.fanNickname || "사용자")}
                            (@${escapeHTML(msg.fanUserId || "")})
                        </div>

                        <div>
                            ${escapeHTML(msg.text)}
                        </div>

                        <button
                            onclick="window.startReply('${msg.id}', '${escapeAttribute(msg.fanNickname || "")}')"
                            style="
                                margin-top:6px;
                                background:#0288D1;
                                color:white;
                                border:none;
                                padding:4px 8px;
                                border-radius:6px;
                                font-size:0.75rem;
                                cursor:pointer;">
                            답장하기
                        </button>
                    `;
                }


            // 일반 팬 화면
            } else {

                if (msg.isArtistSender) {

                    bubble.className =
                        "msg-bubble artist-sky";

                    bubble.innerText =
                        msg.text;

                } else if (msg.isReply) {

                    bubble.className =
                        "msg-bubble reply-box";

                    bubble.innerHTML = `
                        <div class="reply-target-tag">
                            ↳ 아티스트의 답장
                        </div>

                        ${escapeHTML(msg.text)}
                    `;

                } else if (
                    msg.userId === currentUser.userId
                ) {

                    bubble.className =
                        "msg-bubble white-right";

                    bubble.innerText =
                        msg.text;

                } else {

                    return;
                }
            }


            container.appendChild(bubble);

        });


        container.scrollTop =
            container.scrollHeight;
    }


    // =========================================================
    // 답장
    // =========================================================

    window.startReply = function(msgId, fanNick) {

        replyingToMsg = msgId;

        const banner =
            document.getElementById("replyingBanner");

        banner.style.display = "flex";

        document.getElementById("replyingText").innerText =
            `${fanNick}님의 메시지에 답장 중...`;
    };


    window.cancelReply = function() {

        replyingToMsg = null;

        document.getElementById(
            "replyingBanner"
        ).style.display = "none";
    };


    // =========================================================
    // 메시지 보내기
    // =========================================================

    window.sendChatMessage = async function() {

        const input =
            document.getElementById("chatInput");

        const text =
            input.value.trim();


        if (!text || !currentChatArtistId) {
            return;
        }


        if (!isSignedUp || !currentUser.userId) {

            showToast("회원가입 후 이용해주세요!");

            return;
        }


        const targetArtist =
            artists.find(
                a => a.id === currentChatArtistId
            );


        if (!targetArtist) {

            showToast("아티스트 정보를 찾을 수 없습니다.");

            return;
        }


        const isMyArtist =
            targetArtist.linkedUserId === currentUser.userId;


        input.value = "";


        try {

            // 아티스트 답장
            if (isMyArtist && replyingToMsg) {

                await addDoc(
                    collection(db, "messages"),
                    {
                        artistId: currentChatArtistId,
                        sender: targetArtist.name,
                        text: text,

                        isArtistSender: false,
                        isReply: true,

                        replyToId: replyingToMsg,

                        userId: currentUser.userId,

                        fanNickname: "",
                        fanUserId: "",

                        timestamp: serverTimestamp()
                    }
                );

                cancelReply();


            // 아티스트가 먼저 보내는 메시지
            } else if (isMyArtist) {

                await addDoc(
                    collection(db, "messages"),
                    {
                        artistId: currentChatArtistId,

                        sender: targetArtist.name,
                        text: text,

                        isArtistSender: true,
                        isReply: false,

                        userId: currentUser.userId,

                        timestamp: serverTimestamp()
                    }
                );


            // 일반 유저 메시지
            } else {

                await addDoc(
                    collection(db, "messages"),
                    {
                        artistId: currentChatArtistId,

                        sender: currentUser.nickname,

                        fanNickname: currentUser.nickname,
                        fanUserId: currentUser.userId,

                        text: text,

                        isArtistSender: false,
                        isReply: false,

                        userId: currentUser.userId,

                        timestamp: serverTimestamp()
                    }
                );
            }


        } catch (error) {

            console.error(
                "메시지 전송 오류:",
                error
            );

            console.error(
                "오류 코드:",

    window.processSignup = async function() {

                showToast(
                    "이미 존재하는 아이디입니다."

                return;
            }


            await setDoc(
                userRef,

                    createdAt: serverTimestamp()

            );


            currentUser = {

                userId: uid

            await startUserListeners();


            closeModal("signupModal");

            showToast("회원가입 완료!");

    window.saveProfileChanges = async function() {

        const newNick =
            document
                .getElementById("editNickname")
                .value
                .trim();


        const newUid =
            document
                .getElementById("editUserId")
                .value
                .trim();


        const newArtistName =
            document
                .getElementById("editArtistName")
                .value
                .trim();


        if (!newNick || !newUid) {

            showToast(
                "모든 항목을 입력해주세요."
            );

            return;
        }


        if (!validateUserId(newUid)) {

            showToast(
                "아이디는 영문, 숫자, _만 사용할 수 있습니다."
            );

            return;
        }


        const oldUid =
            currentUser.userId;


        try {

            // 아이디가 변경되지 않은 경우
            if (oldUid === newUid) {

                await updateDoc(
                    doc(db, "users", oldUid),
                    {
                        nickname: newNick
                    }
                );


            } else {

                const newUserRef =
                    doc(db, "users", newUid);

                const newUserSnap =
                    await getDoc(newUserRef);


                if (newUserSnap.exists()) {

                    showToast(
                        "이미 사용 중인 아이디입니다."
                    );

                    return;
                }


                // 새 계정 생성
                await setDoc(
                    newUserRef,
                    {
                        userId: newUid,
                        nickname: newNick,
                        createdAt: serverTimestamp()
                    }
                );


                // 기존 아티스트 연결 변경
                const artistSnapshot =
                    await getDocs(
                        query(
                            collection(db, "artists"),
                            where(
                                "linkedUserId",
                                "==",
                                oldUid
                            )
                        )
                    );


                for (const artistDoc of artistSnapshot.docs) {

                    await updateDoc(
                        artistDoc.ref,
                        {
                            linkedUserId: newUid,

                            ...(newArtistName
                                ? { name: newArtistName }
                                : {})
                        }
                    );
                }


                // 기존 회원 삭제
                await deleteDoc(
                    doc(db, "users", oldUid)
                );
            }


            // 아티스트 이름만 변경
            if (oldUid === newUid && newArtistName) {

                const artistSnapshot =
                    await getDocs(
                        query(
                            collection(db, "artists"),
                            where(
                                "linkedUserId",
                                "==",
                                oldUid
                            )
                        )
                    );


                for (const artistDoc of artistSnapshot.docs) {

                    await updateDoc(
                        artistDoc.ref,
                        {
                            name: newArtistName
                        }
                    );
                }
            }


            currentUser = {
                nickname: newNick,
                userId: newUid
            };


            isSignedUp = true;


            localStorage.setItem(
                "gb_current_user",
                JSON.stringify(currentUser)
            );


            closeModal("editProfileModal");

            showToast(
                "정보가 성공적으로 수정되었습니다."
            );


            updateUserInfoUI();

            renderArtistList();

            renderMypageMenu();


        } catch (error) {

            console.error(
                "프로필 수정 오류:",
                error
            );

            showToast(
                "정보 수정에 실패했습니다."
            );
        }
    };

    window.approveBubble = async function(applicantUserId) {

        try {

            const requestRef =
                doc(
                    db,
                    "bubbleRequests",
                    applicantUserId
                );


            const requestSnap =
                await getDoc(requestRef);


            if (!requestSnap.exists()) {

                showToast(
                    "신청 정보를 찾을 수 없습니다."
                );

                return;
            }


            const req =
                requestSnap.data();


            await updateDoc(
                requestRef,
                {
                    status: "approved"
                }
            );


            await addDoc(
                collection(
                    db,
                    "users",
                    applicantUserId,
                    "notifications"
                ),
                {
                    type: "approved",

                    msg:
                        "🎉 물방울 신청이 승낙되었습니다! 사용할 이름을 정해보세요.",

                    createdAt:

            // 방울권 삭제
            // -----------------------------

            const ticketSnapshot =
                await getDocs(
                    query(
                        collection(db, "tickets"),
                        where(
                            "userId",
                            "==",
                            targetUid
                        )
                    )
                );


            for (const ticketDoc of ticketSnapshot.docs) {

                await deleteDoc(
                    ticketDoc.ref
                );
            }


            // -----------------------------
            // 신청 삭제
            // -----------------------------

            await deleteDoc(
                doc(
                    db,
                    "bubbleRequests",
                    targetUid
                )
            ).catch(() => {});


            // -----------------------------
            // 알림 삭제
            // -----------------------------

            const notiSnapshot =
                await getDocs(
                    collection(
                        db,
                        "users",
                        targetUid,
                        "notifications"
                    )
                );


            for (
                const notificationDoc
                of notiSnapshot.docs
            ) {

                await deleteDoc(
                    notificationDoc.ref
                );
            }


            // -----------------------------
            // 유저 삭제
            // -----------------------------

            await deleteDoc(
                doc(
                    db,
                    "users",
                    targetUid
                )
            );


            stopUserListeners();


            isSignedUp = false;

            currentUser = {
                nickname: "",
                userId: ""
            };


            localStorage.removeItem(
                "gb_current_user"
            );


            subscribedTickets = [];
            userNotifications = [];


            closeModal("logoutModal");

            showToast(
                "회원 탈퇴가 완료되었습니다."
            );


            resetToInitialState();


        } catch (error) {

            console.error(
                "회원 탈퇴 오류:",
                error
            );

            showToast(
                "회원 탈퇴 중 오류가 발생했습니다."
            );
        }
    };


    // =========================================================
    // 초기 상태
    // =========================================================

    function resetToInitialState() {

        document.getElementById(
            "displayNickname"
        ).innerText = "비눗방울";


        document.getElementById(
            "displayId"
        ).innerText = "@guest_bubble";


        document.getElementById(
            "authButtonGroup"
        ).style.display = "flex";


        document.getElementById(
            "mypageMenuList"
        ).style.display = "none";


        renderArtistList();

        renderChatList();

        recalculateNotiCount();
    }


    // =========================================================
    // 모달
    // =========================================================

    window.openModal = function(id) {

        document.getElementById(id).style.display =
            "flex";
    };


    window.closeModal = function(id) {

        document.getElementById(id).style.display =
            "none";
    };


    // =========================================================
    // Toast
    // =========================================================

    function showToast(msg) {

        const toast =
            document.getElementById(
                "toastPopup"
            );


        toast.innerText = msg;

        toast.classList.add("show");


        setTimeout(() => {

            toast.classList.remove("show");

        }, 3000);
    }


    // =========================================================
    // HTML 안전 처리
    // =========================================================

    function escapeHTML(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }


    function escapeAttribute(value) {

        return String(value)
            .replaceAll("\\", "\\\\")
            .replaceAll("'", "\\'");
    }

</script>
